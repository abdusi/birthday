<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С Днём Рождения ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --pink: #b02a5b;
    --light-pink: #ffd7e6;
    --cream: #f8eedc;
    --text: #594943;
    --dark: #150009;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    min-height: 100vh;
    padding: 24px 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Montserrat", sans-serif;
    background:
      radial-gradient(circle at 50% 12%, #92004a 0%, #4a0030 45%, #150009 100%);
    overflow-x: hidden;
    position: relative;
  }

  .bg-hearts {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .bg-hearts span {
    position: absolute;
    bottom: -50px;
    color: rgba(255, 105, 160, 0.18);
    font-size: var(--size);
    animation: floatUp var(--duration) linear infinite;
    animation-delay: var(--delay);
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }

  .wrap {
    width: 100%;
    max-width: 500px;
    position: relative;
    z-index: 1;
  }

  .brand {
    margin-bottom: 14px;
    text-align: center;
    color: var(--light-pink);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 4px;
    opacity: 0.9;
  }

  .card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 28px 20px 22px;
    background: var(--cream);
    border-radius: 24px;
    box-shadow:
      0 25px 50px rgba(0, 0, 0, 0.38),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
    overflow: hidden;
  }

  .text-col { flex: 1 1 48%; min-width: 0; }
  .tree-col { flex: 1 1 52%; min-width: 0; }

  .eyebrow {
    margin-bottom: 12px;
    color: var(--pink);
    font-family: "Cormorant Garamond", serif;
    font-size: 1.18rem;
    font-weight: 700;
    line-height: 1.15;
  }

  .message {
    color: var(--text);
    font-family: "Cormorant Garamond", serif;
    font-size: 1.03rem;
    font-weight: 600;
    line-height: 1.42;
    min-height: 185px;
  }

  .thanks {
    margin-top: 10px;
    color: var(--text);
    font-family: "Cormorant Garamond", serif;
    font-size: 1rem;
    font-style: italic;
    line-height: 1.4;
  }

  .divider {
    margin: 15px 0 9px;
    border: 0;
    border-top: 1px dashed #d8a9bb;
  }

  .timer-label {
    margin-bottom: 3px;
    color: #8a6a63;
    font-size: 0.68rem;
    line-height: 1.3;
  }

  .timer {
    color: var(--pink);
    font-size: 0.83rem;
    font-weight: 700;
    line-height: 1.4;
  }

  canvas {
    width: 100%;
    height: auto;
    display: block;
  }

  @media (max-width: 430px) {
    body { padding: 18px 10px; }

    .card {
      gap: 4px;
      padding: 22px 13px 18px;
    }

    .brand {
      font-size: 0.7rem;
      letter-spacing: 3px;
    }

    .eyebrow { font-size: 1rem; }

    .message {
      font-size: 0.88rem;
      min-height: 175px;
    }

    .timer-label { font-size: 0.62rem; }
    .timer { font-size: 0.72rem; }
  }

  @media (max-width: 350px) {
    .card {
      flex-direction: column;
      text-align: center;
    }

    .text-col,
    .tree-col {
      width: 100%;
    }

    .message { min-height: auto; }
    .tree-col { max-width: 260px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-hearts span { animation: none; }
  }
</style>
</head>

<body>

<div class="bg-hearts" id="bgHearts"></div>

<main class="wrap">

  <div class="brand">
    
  </div>

  <section class="card">

    <div class="text-col">

      <div class="eyebrow">
        Для любви всей моей жизни ❤️
      </div>

      <div class="message" id="typedText"></div>

      <div class="thanks">
        <!-- текст перенесён в основное сообщение -->
      </div>

      <hr class="divider">

      <div class="timer-label">
        До твоего дня рождения осталось:
      </div>

      <div class="timer" id="countdown">
        Загрузка...
      </div>

    </div>

    <div class="tree-col">
      <canvas
        id="treeCanvas"
        width="260"
        height="320"
        aria-label="Дерево из сердечек">
      </canvas>
    </div>

  </section>

</main>

<script>
"use strict";

const bgHearts = document.getElementById("bgHearts");
const HEART_COUNT = 22;

for (let i = 0; i < HEART_COUNT; i++) {
  const heart = document.createElement("span");

  heart.textContent = "♥";
  heart.style.left = `${Math.random() * 100}%`;

  heart.style.setProperty(
    "--size",
    `${14 + Math.random() * 26}px`
  );

  heart.style.setProperty(
    "--duration",
    `${10 + Math.random() * 12}s`
  );

  heart.style.setProperty(
    "--delay",
    `${Math.random() * 12}s`
  );

  bgHearts.appendChild(heart);
}

const canvas = document.getElementById("treeCanvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const cx = W * 0.55;
const trunkBaseY = H * 0.92;
const trunkMaxHeight = H * 0.42;
const canopyBottomY = trunkBaseY - trunkMaxHeight;
const heartScale = W * 0.26;
const cy = canopyBottomY - heartScale;

const colors = [
  "#d81b3f",
  "#e6273f",
  "#c2185b",
  "#ff5b7f",
  "#ff8fa8",
  "#ffc2cf",
  "#fff2f0"
];

const hearts = [];
const fallingHearts = [];

function drawHeart(x, y, size, color, opacity = 1, rotation = 0) {
  ctx.save();

  ctx.translate(x, y);

  if (rotation) {
    ctx.rotate(rotation);
  }

  ctx.globalAlpha = opacity;
  ctx.fillStyle = color;

  ctx.beginPath();

  ctx.moveTo(0, 0);

  ctx.bezierCurveTo(
    -size / 2,
    -size / 2,
    -size,
    size / 3,
    0,
    size
  );

  ctx.bezierCurveTo(
    size,
    size / 3,
    size / 2,
    -size / 2,
    0,
    0
  );

  ctx.fill();

  ctx.restore();
}

// Implicit heart-curve test: (u^2+v^2-1)^3 - u^2*v^3 <= 0 traces a heart
// shape (point at v = -1, lobes near v = 1.23). Used to scatter the small
// hearts so the canopy silhouette reads as an actual heart, like the tree
// in the reference video, instead of a plain circle/oval.
function inHeartShape(u, v) {
  const f = Math.pow(u * u + v * v - 1, 3) - u * u * v * v * v;
  return f <= 0;
}

const maxHeartDist = Math.sqrt(1.15 * 1.15 + 1.25 * 1.25);

const LEAF_COUNT = 240;
let leafAttempts = 0;

while (hearts.length < LEAF_COUNT && leafAttempts < LEAF_COUNT * 40) {
  leafAttempts++;

  const u = (Math.random() * 2 - 1) * 1.15;
  const v = -1.0 + Math.random() * 2.25;

  if (!inHeartShape(u, v)) {
    continue;
  }

  const dist = Math.sqrt(u * u + v * v);

  hearts.push({
    x: cx + u * heartScale,
    y: cy - v * heartScale,
    size: Math.random() * 6 + 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    rotation: (Math.random() - 0.5) * 0.7,
    delay: (dist / maxHeartDist) * 0.5 + Math.random() * 0.08
  });
}

function createFallingHeart() {
  const source =
    hearts[Math.floor(Math.random() * hearts.length)];

  fallingHearts.push({
    x: source.x,
    y: source.y,
    size: Math.random() * 4.5 + 2.5,
    color: source.color,
    speedY: Math.random() * 0.6 + 0.35,
    speedX: -(Math.random() * 0.9 + 0.3),
    swayPhase: Math.random() * Math.PI * 2,
    swayAmp: Math.random() * 0.9 + 0.4,
    rotation: (Math.random() - 0.5) * Math.PI,
    rotSpeed: (Math.random() - 0.5) * 0.05,
    opacity: 1
  });
}

let progress = 0;
let typingStarted = false;

function animate() {
  ctx.clearRect(0, 0, W, H);

  if (progress > 0.1) {
    const trunkHeight =
      Math.min(
        (progress - 0.1) * (H * 0.5),
        trunkMaxHeight
      );

    const topY = trunkBaseY - trunkHeight;
    const baseHalfWidth = Math.min((progress - 0.1) * 22, 9);
    const topHalfWidth = baseHalfWidth * 0.35;

    ctx.fillStyle = "#5d4037";
    ctx.beginPath();
    ctx.moveTo(cx - baseHalfWidth, trunkBaseY);
    ctx.lineTo(cx - topHalfWidth, topY);
    ctx.lineTo(cx + topHalfWidth, topY);
    ctx.lineTo(cx + baseHalfWidth, trunkBaseY);
    ctx.closePath();
    ctx.fill();

    if (trunkHeight >= trunkMaxHeight * 0.98) {
      ctx.strokeStyle = "#6d4c41";
      ctx.lineWidth = Math.max(topHalfWidth * 0.9, 2);
      ctx.lineCap = "round";

      ctx.beginPath();
      ctx.moveTo(cx, topY + 4);
      ctx.lineTo(cx - heartScale * 0.32, topY - heartScale * 0.28);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx, topY + 4);
      ctx.lineTo(cx + heartScale * 0.3, topY - heartScale * 0.32);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx, topY + 6);
      ctx.lineTo(cx, topY - heartScale * 0.2);
      ctx.stroke();
    }
  }

  if (progress > 0.4) {
    const heartProgress =
      (progress - 0.4) / 0.6;

    hearts.forEach(heart => {
      if (heartProgress > heart.delay) {
        const scale = Math.min(
          (heartProgress - heart.delay) * 2,
          1
        );

        drawHeart(
          heart.x,
          heart.y,
          heart.size * scale,
          heart.color,
          1,
          heart.rotation
        );
      }
    });
  }

  if (progress >= 1) {
    if (Math.random() < 0.35 && fallingHearts.length < 70) {
      createFallingHeart();
    }

    for (
      let i = fallingHearts.length - 1;
      i >= 0;
      i--
    ) {
      const heart = fallingHearts[i];

      heart.y += heart.speedY;
      heart.swayPhase += 0.05;
      heart.rotation += heart.rotSpeed;

      heart.x +=
        heart.speedX +
        Math.sin(heart.swayPhase) * heart.swayAmp * 0.3;

      if (heart.y > H * 0.7) {
        heart.opacity -= 0.012;
      }

      if (
        heart.opacity <= 0 ||
        heart.y > H * 0.98 ||
        heart.x < -10
      ) {
        fallingHearts.splice(i, 1);
      } else {
        drawHeart(
          heart.x,
          heart.y,
          heart.size,
          heart.color,
          heart.opacity,
          heart.rotation
        );
      }
    }

    if (!typingStarted) {
      typingStarted = true;
      startTyping();
    }
  }

  if (progress < 1) {
    progress += 0.008;
  }

  requestAnimationFrame(animate);
}

const messageText =
  "Осталось совсем немного до твоего праздника, и хоть ма да пеши ть нестм, и между нами километры расстояния, искренне надеюсь что этот день мы проведём вместе (насиб), " +
  "\n\n" +
  "Я прекрасно помню что да ть текстои калон намефоран, неки я не знаю другого способа выразить свои чувства и я не умею писать маленькие текста (хаётай)." +
  "\n\n" +
  "Хай день рожденият шид надеюсь ай хона мегрези, мерем кино, рузи дароз хардумон мегардем девонаги када, ба ай ягон 13 этажка мепартоем худмона и всё." +
  "\n\n" +
  "Люблю целую обнимаю Шахи-joni ma." +
  "\n\n" +
  "С любовью, Abdu";

const typedText = document.getElementById("typedText");

let charIndex = 0;

function startTyping() {
  if (charIndex >= messageText.length) {
    return;
  }

  const char = messageText[charIndex];

  if (char === "\n") {
    typedText.appendChild(
      document.createElement("br")
    );

    typedText.appendChild(
      document.createElement("br")
    );
  } else {
    typedText.appendChild(
      document.createTextNode(char)
    );
  }

  charIndex++;

  setTimeout(startTyping, 28);
}

const targetDate = new Date(
  2026,
  8,
  17,
  0,
  0,
  0
);

const countdown = document.getElementById("countdown");

function updateTimer() {
  const now = new Date();

  const difference =
    targetDate.getTime() - now.getTime();

  if (difference <= 0) {
    countdown.textContent =
      "С Днём Рождения! 🎉✨";

    return;
  }

  const totalSeconds =
    Math.floor(difference / 1000);

  const days =
    Math.floor(totalSeconds / 86400);

  const hours =
    Math.floor((totalSeconds % 86400) / 3600);

  const minutes =
    Math.floor((totalSeconds % 3600) / 60);

  const seconds =
    totalSeconds % 60;

  countdown.textContent =
    `${days} дн. ` +
    `${hours} час. ` +
    `${minutes} мин. ` +
    `${seconds} сек.`;
}

updateTimer();
setInterval(updateTimer, 1000);

animate();

</script>

</body>
</html>
